<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>带进度条的目标打卡网页</title>
  <style>
    :root {
      --primary: #21926c;
      --primary-hover: #041648;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      max-width: 600px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: #ffffff;
      padding: 36px 32px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .content {
      padding: 32px;
    }

    .interactive-card {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }

    .counter-display {
      font-size: 36px;
      font-weight: 700;
      color: var(--primary);
      margin: 8px 0;
      transition: color 0.3s ease, transform 0.15s ease;
    }

    .progress-track {
      background: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin: 16px 0;
    }

    #progressBar {
      background-color: var(--primary);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .btn {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>我的第一个设计的网页</h1>
      <p>点击按钮推进进度条，冲刺 20 次目标！</p>
    </div>

    <div class="content">
      <div class="interactive-card">
        <p style="font-size: 14px; color: var(--text-muted);">当前已完成次数：</p>
        <div class="counter-display" id="countDisplay">0</div>

        <!-- 进度条底槽与填充物 -->
        <div class="progress-track">
          <div id="progressBar"></div>
        </div>

        <button class="btn" id="clickBtn">点我打卡一次</button>
      </div>

      <div class="footer">
        目标状态：<span id="statusText">进行中 (0 / 20)</span>
      </div>
    </div>
  </div>

  <script>
    let count = 0;
    const maxGoal = 20;

    const btn = document.getElementById('clickBtn');
    const display = document.getElementById('countDisplay');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');

    btn.addEventListener('click', () => {
      count++;
      display.textContent = count;

      // 计算百分比并限制最大值为 100%
      const percentage = Math.min((count / maxGoal) * 100, 100);
      progressBar.style.width = percentage + '%';

      // 实时更新底部文字状态
      if (count < maxGoal) {
        statusText.textContent = `进行中 (${count} / ${maxGoal})`;
      } else {
        statusText.textContent = '🎉 恭喜你，目标已达成！';
        display.style.color = '#eab308';
        progressBar.style.backgroundColor = '#eab308';
      }

      // 数字点击微动效
      display.style.transform = 'scale(1.1)';
      setTimeout(() => {
        display.style.transform = 'scale(1)';
      }, 150);
    });
  </script>
</body>
</html>
