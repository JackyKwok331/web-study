<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jacky House</title>
  <style>
    :root {
      --primary: #21926c;
      --primary-hover: #041648;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      max-width: 600px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    /* 顶部标题区 */
    .header {
      background: linear-gradient(135deg, #5591f2 0%, #1d4ed8 100%);
      color: #ffffff;
      padding: 22px 28px 24px;
      text-align: left;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.2px;
    }

    .header p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.88);
    }

    /* 天气卡片样式 */
    .weather-bar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      font-size: 13px;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .weather-icon {
      font-size: 16px;
    }

    .content {
      padding: 28px;
    }

    /* 签到模块样式 */
    .checkin-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }

    .checkin-info {
      text-align: left;
    }

    .checkin-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
    }

    .checkin-status {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }

    /* 照片展示模块样式 */
    .photo-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .photo-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .photo-wrapper {
      width: 100%;
      height: 280px;
      background-color: #f1f5f9;
      overflow: hidden;
    }

    .photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .photo-card:hover .photo-img {
      transform: scale(1.03);
    }

    .photo-info {
      padding: 20px;
      text-align: left;
    }

    .photo-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      background: rgba(33, 146, 108, 0.1);
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .photo-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .photo-desc {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Jacky House</h1>
      <p>记录生活中的美好瞬间与日常灵感</p>
      
      <!-- 天气展示容器 -->
      <div class="weather-bar" id="weatherBar">
        <span class="weather-icon" id="weatherIcon">⏳</span>
        <span id="weatherText">正在获取今日天气...</span>
      </div>
    </div>

    <div class="content">
      <!-- 每日签到区域 -->
      <div class="checkin-box">
        <div class="checkin-info">
          <div class="checkin-title" id="checkinTitle">📅 今日签到</div>
          <div class="checkin-status" id="checkinStatus">今日尚未签到</div>
        </div>
        <button class="btn" id="checkinBtn">立即签到</button>
      </div>

      <!-- 照片展示模块 -->
      <div class="photo-card">
        <div class="photo-wrapper">
          <img 
            src="photo_2026-10-21_19-49-36.jpg" 
            alt="我的精选照片" 
            class="photo-img"
          >
        </div>
        <div class="photo-info">
          <div class="photo-tag">精选瞬间</div>
          <div class="photo-title">温暖角落 · 温润日常</div>
          <div class="photo-desc">生活不在别处，当下即是全部。保留一份松弛感，用心感受生活细节。</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1. 签到功能与连续天数逻辑
    let streakDays = 0;

    const checkinBtn = document.getElementById('checkinBtn');
    const checkinStatus = document.getElementById('checkinStatus');
    const checkinTitle = document.getElementById('checkinTitle');

    checkinBtn.addEventListener('click', () => {
      streakDays++;

      checkinBtn.disabled = true;
      checkinBtn.textContent = '已签到';

      checkinTitle.innerHTML = `📅 已签到 <span style="color: var(--primary); font-weight: 700;">${streakDays}</span> 天`;

      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');

      checkinStatus.textContent = `已于 ${hours}:${minutes} 完成签到 ✅`;
      checkinStatus.style.color = 'var(--primary)';
    });

    // 2. 天气获取逻辑
    const weatherIcon = document.getElementById('weatherIcon');
    const weatherText = document.getElementById('weatherText');

    function getWeatherDesc(code) {
      if (code === 0) return { desc: '晴天', icon: '☀️' };
      if ([1, 2, 3].includes(code)) return { desc: '多云 / 阴', icon: '⛅' };
      if ([45, 48].includes(code)) return { desc: '有雾', icon: '🌫️' };
      if ([51, 53, 55, 61, 63, 65].includes(code)) return { desc: '小雨 / 中雨', icon: '🌧️' };
      if ([71, 73, 75].includes(code)) return { desc: '下雪', icon: '❄️' };
      if ([80, 81, 82].includes(code)) return { desc: '阵雨', icon: '🌦️' };
      if ([95, 96, 99].includes(code)) return { desc: '雷阵雨', icon: '⛈️' };
      return { desc: '阴天', icon: '☁️' };
    }

    async function fetchWeather(lat, lon, cityName = '本地') {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`;
        const res = await fetch(url);
        const data = await res.json();

        const temp = Math.round(data.current.temperature_2m);
        const code = data.current.weather_code;
        const weather = getWeatherDesc(code);

        weatherIcon.textContent = weather.icon;
        weatherText.textContent = `${cityName} ${weather.desc} · ${temp}℃`;
      } catch (err) {
        weatherIcon.textContent = '🌤️';
        weatherText.textContent = '天气数据加载失败';
        console.error('获取天气信息失败:', err);
      }
    }

    // 尝试定位，如果拒绝或失败则自动回退到默认城市（上海）
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude, '当前位置'),
        () => fetchWeather(31.2304, 121.4737, '上海'),
        { timeout: 5000 }
      );
    } else {
      fetchWeather(31.2304, 121.4737, '上海');
    }
  </script>
</body>
</html>
